name: Dev checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Foundry FM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi

          pattern='^(feat|fix|data|ui|docs|ci|refactor|chore|release)(\([a-zA-Z0-9._-]+\))?: .+'

          failed=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            [[ "$subject" =~ ^Merge[[:space:]] ]] && continue

            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit non conforme: $subject"
              failed=1
            fi
          done < <(git log --format='%s' "$RANGE")

          if [[ "$failed" -ne 0 ]]; then
            echo "Format attendu : type: description ou type(scope): description"
            exit 1
          fi

      - name: Validate manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
          if (!m.id || !m.version) throw new Error("module.json invalide");
          if (m.id !== "foundry-fm") throw new Error("ID module inattendu");

          const files = [
            ...(m.esmodules ?? []),
            ...(m.scripts ?? []),
            ...(m.styles ?? []),
            ...((m.languages ?? []).map((l) => l.path).filter(Boolean))
          ];

          for (const file of files) {
            if (!fs.existsSync(file)) throw new Error(`Fichier déclaré introuvable: ${file}`);

            if (file.includes("/")) {
              const shadow = path.basename(file);
              if (fs.existsSync(shadow)) {
                throw new Error(`Copie fantôme interdite à la racine: ${shadow} (source active: ${file})`);
              }
            }
          }

          console.log(m.id + " v" + m.version);
          NODE

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return walk(full);
              return entry.isFile() && entry.name.endsWith(".json") ? [full] : [];
            });
          }

          const files = ["module.json", ...["lang", "data", "assets"]
            .filter((dir) => fs.existsSync(dir))
            .flatMap(walk)];

          for (const file of files) JSON.parse(fs.readFileSync(file, "utf8"));
          console.log(files.length + " fichiers JSON validés.");
          NODE
